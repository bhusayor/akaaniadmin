<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akaani Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- React clears #root on mount, taking this with it. It is only ever
           seen when the bundle never ran — this file opened directly, or served
           by a plain static server such as VS Code Live Server, neither of
           which can compile the JSX in /src. Beats a silent white page. -->
      <div id="boot-help" hidden></div>
    </div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      // Classic script, so it runs even when the module above cannot.
      setTimeout(function () {
        var el = document.getElementById('boot-help');
        if (!el) return; // React mounted and removed it — nothing to say
        el.hidden = false;
        el.style.cssText =
          'font-family:system-ui,sans-serif;max-width:34rem;margin:12vh auto;' +
          'padding:0 1.5rem;color:#111827;line-height:1.6';
        el.innerHTML = [
          '<h1 style="font-size:1.25rem;margin:0 0 .5rem">Akaani Admin needs to be built</h1>',
          '<p style="color:#6B7280;margin:0 0 1.25rem">This page is the Vite entry point. It loads ',
          '<code>/src/main.jsx</code>, which a plain static server cannot compile. Use one of these:</p>',
          '<pre style="background:#F9FAFB;border:1px solid #E5E7EB;border-radius:10px;padding:1rem;',
          'overflow-x:auto;font-size:.8125rem;margin:0 0 1rem">npm install\nnpm run dev',
          '            <span style="color:#6B7280"># http://localhost:5173</span></pre>',
          '<p style="color:#6B7280;margin:0 0 .5rem">Prefer Live Server? Build first, then point it ',
          'at <code>dist/</code> rather than this folder:</p>',
          '<pre style="background:#F9FAFB;border:1px solid #E5E7EB;border-radius:10px;padding:1rem;',
          'overflow-x:auto;font-size:.8125rem;margin:0">npm run build:watch',
          '    <span style="color:#6B7280"># rebuilds dist/ as you edit</span></pre>',
        ].join('');
      }, 2000);
    </script>
  </body>
</html>
