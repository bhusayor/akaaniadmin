<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akaani Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Outfit', sans-serif; background: #003232; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .splash {
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    animation: fadeIn 0.6s ease both;
  }
  .logo-wrap {
    width: 64px; height: 64px; background: #5DCAA5; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-wrap svg { width: 36px; height: 36px; }
  .brand { font-size: 32px; font-weight: 700; color: #fff; letter-spacing: -0.03em; }
  .sub { font-size: 14px; color: rgba(255,255,255,0.4); }
  .loader { display: flex; gap: 6px; margin-top: 10px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #5DCAA5; opacity: 0.3; animation: pulse 1.2s ease-in-out infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%,100%{opacity:0.3;transform:scale(1)} 50%{opacity:1;transform:scale(1.2)} }
  @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>
<div class="splash">
  <div class="logo-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="#003232" stroke-width="2.5" stroke-linecap="round">
      <path d="M12 2C8 2 5 6 5 10c0 5 7 12 7 12s7-7 7-12c0-4-3-8-7-8z"/>
      <circle cx="12" cy="10" r="2.5" fill="#003232" stroke="none"/>
    </svg>
  </div>
  <div class="brand">akaani</div>
  <div class="sub">Admin Dashboard</div>
  <div class="loader">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>
<script>
  // Redirect to dashboard after brief splash
  setTimeout(() => { window.location.href = 'pages/dashboard.html'; }, 1200);
</script>
</body>
</html>
